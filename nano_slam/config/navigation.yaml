# Provisional SIMULATION geometry and limits. Replace with measured hardware values later.
shutdown_costmaps: false
controller_frequency: 10.0
planner_frequency: 1.0
planner_patience: 5.0
controller_patience: 8.0
oscillation_timeout: 12.0
oscillation_distance: 0.15
base_global_planner: navfn/NavfnROS
base_local_planner: dwa_local_planner/DWAPlannerROS
recovery_behavior_enabled: true
clearing_rotation_allowed: true
global_costmap:
  global_frame: map
  robot_base_frame: base_link
  update_frequency: 2.0
  publish_frequency: 1.0
  transform_tolerance: 0.5
  static_map: true
  rolling_window: false
  footprint: [[-0.20,-0.15],[-0.20,0.15],[0.20,0.15],[0.20,-0.15]]
  footprint_padding: 0.08
  plugins:
    - {name: static_layer, type: 'costmap_2d::StaticLayer'}
    - {name: obstacle_layer, type: 'costmap_2d::ObstacleLayer'}
    - {name: inflation_layer, type: 'costmap_2d::InflationLayer'}
  obstacle_layer:
    observation_sources: laser
    laser: {sensor_frame: laser, data_type: LaserScan, topic: /scan, marking: true, clearing: true, obstacle_range: 5.0, raytrace_range: 7.5, expected_update_rate: 0.4}
  inflation_layer: {inflation_radius: 0.55, cost_scaling_factor: 3.0}
local_costmap:
  global_frame: odom
  robot_base_frame: base_link
  update_frequency: 8.0
  publish_frequency: 2.0
  transform_tolerance: 0.5
  static_map: false
  rolling_window: true
  width: 4.0
  height: 4.0
  resolution: 0.05
  footprint: [[-0.20,-0.15],[-0.20,0.15],[0.20,0.15],[0.20,-0.15]]
  footprint_padding: 0.08
  plugins:
    - {name: obstacle_layer, type: 'costmap_2d::ObstacleLayer'}
    - {name: inflation_layer, type: 'costmap_2d::InflationLayer'}
  obstacle_layer:
    observation_sources: laser
    laser: {sensor_frame: laser, data_type: LaserScan, topic: /scan, marking: true, clearing: true, obstacle_range: 5.0, raytrace_range: 7.5, expected_update_rate: 0.4}
  inflation_layer: {inflation_radius: 0.55, cost_scaling_factor: 3.0}
DWAPlannerROS:
  max_vel_x: 0.35
  min_vel_x: 0.0
  max_vel_y: 0.0
  min_vel_y: 0.0
  max_vel_trans: 0.35
  min_vel_trans: 0.04
  max_vel_theta: 0.8
  min_vel_theta: 0.15
  acc_lim_x: 0.5
  acc_lim_y: 0.0
  acc_lim_theta: 1.5
  xy_goal_tolerance: 0.15
  yaw_goal_tolerance: 0.15
  latch_xy_goal_tolerance: true
  sim_time: 2.0
  vx_samples: 12
  vy_samples: 1
  vth_samples: 24
  path_distance_bias: 24.0
  goal_distance_bias: 18.0
  occdist_scale: 0.20
  forward_point_distance: 0.2
  stop_time_buffer: 0.3
  scaling_speed: 0.25
  max_scaling_factor: 0.15
  publish_traj_pc: false
  publish_cost_grid_pc: false
